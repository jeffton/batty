<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { createPinia } from "pinia";
      import FullPopover from "./FullPopover.vue";
      import SubagentSessionPopover from "./SubagentSessionPopover.vue";
      import "../styles.css";

      createApp({
        render: () => [
          h("button", { popovertarget: "parent" }, "Open parent"),
          h(
            FullPopover,
            { popoverId: "parent", title: "Parent" },
            {
              default: () => [
                h("button", { popovertarget: "worker" }, "Open worker"),
                h(SubagentSessionPopover, { popoverId: "worker", sessionId: "worker" }),
              ],
            },
          ),
        ],
      })
        .use(createPinia())
        .mount("#app");
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { createPinia } from "pinia";
      import SettingsPopover from "./SettingsPopover.vue";
      import { useAppStore } from "../stores/app";
      import "../styles.css";
      const pinia = createPinia();
      const store = useAppStore(pinia);
      store.workspaces = [
        { id: "assistant", label: "Assistant workspace", path: "/fixture", isAssistant: true },
      ];
      store.settings.pushTitle = "Batty";
      store.settings.memoryLanguage = "English";
      store.models = [
        {
          id: "fixture/model",
          label: "Sol",
          provider: "fixture",
          reasoning: true,
          thinkingLevels: ["medium"],
          supportsImages: true,
        },
        {
          id: "fixture/memory",
          label: "Luna",
          provider: "fixture",
          reasoning: true,
          thinkingLevels: ["high"],
          supportsImages: true,
        },
      ];
      store.settings.defaultThinkingLevel = "medium";
      store.settings.memoryModel = "fixture/memory";
      store.settings.defaultModel = "model";
      store.settings.defaultProvider = "fixture";
      store.getBattyAgentsFile = async () => "Global instructions";
      store.setBattyAgentsFile = async (content) => content;
      store.providerAuth = {
        providers: [
          { id: "openai", name: "OpenAI", connected: true, authKind: "oauth" },
          { id: "google", name: "Google", connected: false, authKind: "apiKey" },
          { id: "openrouter", name: "OpenRouter", connected: false, authKind: "apiKey" },
        ],
      };
      store.bootstrap = async () => {};
      store.refreshProviderAuthStatus = async () => {};
      createApp({
        render: () => h(SettingsPopover, { popoverId: "settings", anchorName: "--settings" }),
      })
        .use(pinia)
        .mount("#app");
      document.getElementById("settings").showPopover();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { createPinia } from "pinia";
      import ChatHeader from "./ChatHeader.vue";
      import SharedSitesList from "./SharedSitesList.vue";
      import { useAppStore } from "../stores/app";
      import "../styles.css";

      window.__BATTY_BASE_URL__ = "/nested/app";
      const pinia = createPinia();
      const store = useAppStore(pinia);
      Object.assign(store.settings, {
        pushTitle: "Sites fixture",
        memoryModel: "fixture/model",
        memoryReasoning: "medium",
        memoryLanguage: "English",
      });
      const attachment = {
        kind: "site",
        id: "attached",
        name: "Chat attachment",
        url: "/old/sites/attached/",
        public: false,
      };
      createApp({
        render: () => [
          h(ChatHeader),
          h(SharedSitesList, { sites: [attachment], idPrefix: "chat" }),
        ],
      })
        .use(pinia)
        .mount("#app");
    </script>
  </body>
</html>

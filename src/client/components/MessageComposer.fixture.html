<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <output id="submissions" hidden>[]</output>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import MessageComposer from "./MessageComposer.vue";
      import "../styles.css";
      const params = new URLSearchParams(location.search);
      const submissions = [];
      createApp({
        setup: () => {
          const streaming = ref(params.has("streaming"));
          const memoryError = ref();
          const memoryPending = ref(params.has("memory") ? 1 : 0);
          window.addEventListener("fixture:finish-memory", () => {
            memoryPending.value = 0;
          });
          window.addEventListener("fixture:memory-error", () => {
            memoryError.value = "Error: WebSocket closed 1000";
          });
          const subagents = ref(
            params.has("tasks")
              ? [{ sessionId: "fixture-agent", prompt: "Fixture task", workspaceId: "fixture" }]
              : [],
          );
          window.addEventListener("fixture:finish-agent", () => {
            subagents.value = [];
          });
          window.addEventListener("fixture:finish-main", () => {
            streaming.value = false;
          });
          return () =>
            h(MessageComposer, {
              streaming: streaming.value,
              memoryPending: memoryPending.value,
              memoryError: memoryError.value,
              subagents: subagents.value,
              onSubmit: (text) => {
                submissions.push(text);
                document.getElementById("submissions").textContent = JSON.stringify(submissions);
              },
            });
        },
      }).mount("#app");
    </script>
  </body>
</html>

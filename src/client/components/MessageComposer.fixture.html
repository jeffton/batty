<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #app {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #app > .composer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <output id="submissions" hidden>[]</output>
    <script type="module">
      import { createApp, h, ref, watchEffect } from "vue";
      import { createPinia } from "pinia";
      import { useAppStore } from "../stores/app";
      import ChatHeader from "./ChatHeader.vue";
      import MessageComposer from "./MessageComposer.vue";
      import "../styles.css";
      const params = new URLSearchParams(location.search);
      const submissions = [];
      createApp({
        setup: () => {
          const composer = ref();
          let journal;
          window.addEventListener("fixture:reject-send", () => {
            if (journal)
              void composer.value.recoverSubmission(journal.tab, journal.session, journal.draft);
          });
          const offline = ref(!navigator.onLine);
          const streaming = ref(params.has("streaming"));
          for (const event of ["offline", "online"]) {
            window.addEventListener(event, () => {
              offline.value = !navigator.onLine;
            });
          }
          window.addEventListener("fixture:restore", () => {
            void composer.value.restore(
              "fixture",
              "Failed prompt",
              [new File(["failed bytes"], "failed.txt")],
              "8d0fb963-f020-4c91-8981-b9add2a6552e",
            );
          });
          const memoryError = ref();
          const memoryPending = ref(params.has("memory") ? 1 : 0);
          window.addEventListener("fixture:finish-memory", () => {
            memoryPending.value = 0;
          });
          window.addEventListener("fixture:memory-error", () => {
            memoryError.value = "Error: WebSocket closed 1000";
          });
          const subagents = ref(
            params.has("tasks")
              ? [{ sessionId: "fixture-agent", prompt: "Fixture task", workspaceId: "fixture" }]
              : [],
          );
          window.addEventListener("fixture:finish-agent", () => {
            subagents.value = [];
          });
          window.addEventListener("fixture:start-main", () => {
            streaming.value = true;
          });
          window.addEventListener("fixture:finish-main", () => {
            streaming.value = false;
          });
          if (params.has("header")) {
            const store = useAppStore();
            store.settings.cloudBrowserAvailable = true;
            Object.assign(store.settings, {
              pushTitle: "Batty fixture",
              memoryModel: "fixture/model",
              memoryReasoning: "medium",
              memoryLanguage: "English",
            });
            store.activeSession = {
              model: "fixture/model",
              contextTokens: 12_000,
              contextWindow: 32_000,
              contextPercent: 37.5,
            };
            store.providerUsage = {
              provider: "fixture",
              usage: {
                windows: [
                  {
                    id: "hour",
                    usedPercent: 23,
                    windowSeconds: 3600,
                    resetsAt: Date.now() + 300_000,
                  },
                ],
              },
            };
            watchEffect(() => {
              store.connectionState = offline.value ? "offline" : "online";
            });
            window.addEventListener("fixture:hide-header-controls", () => {
              store.settings.cloudBrowserAvailable = false;
              store.providerUsage = undefined;
            });
          }
          return () => [
            params.has("header") ? h(ChatHeader) : null,
            h(MessageComposer, {
              ref: composer,
              draftsEnabled: params.has("drafts"),
              sessionKey: params.has("drafts") ? "fixture" : undefined,
              offline: offline.value,
              actionsDisabled: offline.value,
              streaming: streaming.value,
              memoryPending: memoryPending.value,
              memoryError: memoryError.value,
              subagents: subagents.value,
              onSubmit: async (text, files, retryId) => {
                if (params.has("journal")) {
                  journal = await composer.value.journalSubmission("fixture", {
                    text,
                    files,
                    retryId: retryId ?? crypto.randomUUID(),
                  });
                }
                submissions.push(text);
                document.getElementById("submissions").textContent = JSON.stringify(submissions);
              },
            }),
          ];
        },
      })
        .use(createPinia())
        .mount("#app");
    </script>
  </body>
</html>

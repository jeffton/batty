<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { createPinia } from "pinia";
      import ToolsPopover from "./ToolsPopover.vue";
      import { useAppStore } from "../stores/app";
      import "../styles.css";
      const pinia = createPinia();
      const store = useAppStore(pinia);
      store.workspaces = [
        {
          id: "project",
          label: "Project",
          path: "/fixture/project",
          kind: "workspace",
          isAssistant: true,
          isPinned: false,
        },
        {
          id: "other",
          label: "Other",
          path: "/fixture/other",
          kind: "workspace",
          isAssistant: false,
          isPinned: false,
        },
        {
          id: "long",
          label: "Workspace-with-an-unbroken-name-that-needs-to-wrap-on-a-small-screen",
          path: "/fixture/projects/with-a-long-unbroken-directory-name-and-more-nested-folders/source",
          kind: "workspace",
          isAssistant: false,
          isPinned: false,
        },
      ];
      createApp({ render: () => h(ToolsPopover, { popoverId: "tools", anchorName: "--tools" }) })
        .use(pinia)
        .mount("#app");
      document.getElementById("tools").showPopover();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #app > * {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="app" style="height: 90vh; display: flex"></div>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import { createPinia } from "pinia";
      import SessionTranscriptView from "./SessionTranscriptView.vue";
      import { mergeSessionState } from "../lib/session-state.ts";
      import { createSessionConnection } from "../lib/session-connection.ts";
      import "../styles.css";

      const session = ref();
      const stream = createSessionConnection({
        operation: "session.watch",
        input: () => ({ sessionId: "main" }),
        onConnecting() {},
        onError() {},
        onEvent(event) {
          if (event.type === "reset")
            session.value = session.value
              ? mergeSessionState(event.state, session.value)
              : event.state;
        },
      });
      stream.open();
      window.addEventListener("pagehide", () => stream.close());
      createApp({
        setup: () => () =>
          session.value
            ? h(SessionTranscriptView, {
                session: session.value,
                alwaysShowDetails: false,
                showTimestamps: false,
              })
            : h("p", "Connecting"),
      })
        .use(createPinia())
        .mount("#app");
    </script>
  </body>
</html>

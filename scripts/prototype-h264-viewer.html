<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1" /><style>
  body {
    margin: 0;
    padding: 16px;
    font: 14px Arial;
    background: #111;
    color: white;
  }
  canvas {
    width: 358px;
    height: 757px;
    display: block;
    touch-action: none;
  }
  #status {
    position: absolute;
    top: 0;
    left: 16px;
  }</style
><span id="status">Connecting</span><canvas width="716" height="1514"></canvas>
<script>
  window.trace = [];
  window.inputs = [];
  window.failure = "";
  window.codecSupport = {};
  let inputId = 0,
    trial = 0;
  const canvas = document.querySelector("canvas"),
    ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: true });
  const socket = new WebSocket("ws://" + location.host + "/socket");
  socket.binaryType = "arraybuffer";
  window.socket = socket;
  socket.onclose = (event) => (window.failure = "Socket closed " + event.code);
  socket.onerror = () => (window.failure = "Socket transport error");
  function paint(image, frameId) {
    ctx.drawImage(image, 0, 0, 716, 1514);
    const pixel = ctx.getImageData(6, 6, 1, 1).data;
    const mark = [pixel[0], pixel[1], pixel[2]]
      .map((x) => Math.round((x - 16) / 32))
      .reduce((n, x, i) => n + x * 8 ** i, 0);
    window.trace.push({ stage: "paint", time: performance.now(), frameId, mark });
    canvas.dataset.frame = String(frameId);
    canvas.dataset.mark = String(mark);
    document.querySelector("#status").textContent = "__CODEC__ live";
    socket.send(JSON.stringify({ action: "ack", frameId }));
  }
  let decoder;
  let queue = Promise.resolve();
  socket.onmessage = (event) => {
    if (typeof event.data === "string") {
      const data = JSON.parse(event.data);
      if (data.error) {
        window.failure = data.error;
        throw Error(data.error);
      }
      return;
    }
    const bytes = new Uint8Array(event.data),
      length = new DataView(event.data).getUint32(0),
      meta = JSON.parse(new TextDecoder().decode(bytes.slice(4, 4 + length))),
      payload = bytes.slice(4 + length);
    window.trace.push({
      stage: "receive",
      time: performance.now(),
      frameId: meta.frameId,
      bytes: bytes.length,
    });
    if ("__CODEC__" === "jpeg") {
      queue = queue
        .then(async () => {
          const bitmap = await createImageBitmap(new Blob([payload], { type: "image/jpeg" }));
          await new Promise((resolve) => requestAnimationFrame(resolve));
          paint(bitmap, meta.frameId);
          bitmap.close();
        })
        .catch((error) => {
          window.failure = String(error);
        });
    } else {
      if (!decoder) {
        const config = { codec: meta.codec, optimizeForLatency: true };
        window.codecSupport = { codec: meta.codec, decoder: typeof VideoDecoder };
        decoder = new VideoDecoder({
          output: (frame) => {
            paint(frame, frame.timestamp);
            frame.close();
          },
          error: (error) => {
            window.failure = String(error);
          },
        });
        decoder.configure(config);
        VideoDecoder.isConfigSupported(config).then(
          (result) => (window.codecSupport.supported = result.supported),
        );
      }
      decoder.decode(
        new EncodedVideoChunk({
          type: meta.key ? "key" : "delta",
          timestamp: meta.frameId,
          data: payload,
        }),
      );
    }
  };
  let held = false,
    startedAt = 0;
  const point = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
  };
  function send(e, phase) {
    e.preventDefault();
    if (phase === "start") {
      trial++;
      startedAt = performance.now();
      held = true;
      canvas.setPointerCapture(e.pointerId);
    }
    if (!held) return;
    const item = {
      action: "touch",
      phase,
      ...point(e),
      inputId: ++inputId,
      trial,
      elapsedMs: performance.now() - startedAt,
    };
    window.inputs.push({ ...item, time: performance.now() });
    socket.send(JSON.stringify(item));
    if (phase === "end" || phase === "cancel") held = false;
  }
  canvas.onpointerdown = (e) => send(e, "start");
  canvas.onpointermove = (e) => held && send(e, "move");
  canvas.onpointerup = (e) => send(e, "end");
  canvas.onpointercancel = (e) => send(e, "cancel");
</script>

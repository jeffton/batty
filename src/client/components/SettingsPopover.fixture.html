<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import { createPinia } from "pinia";
      import SettingsPopover from "./SettingsPopover.vue";
      import CronPopover from "./CronPopover.vue";
      import ToolsPopover from "./ToolsPopover.vue";
      import ChatHeader from "./ChatHeader.vue";
      import MessageComposer from "./MessageComposer.vue";
      import { useAppStore } from "../stores/app";
      import "../styles.css";
      const pinia = createPinia();
      const store = useAppStore(pinia);
      store.workspaces = [
        {
          id: "assistant",
          label:
            new URLSearchParams(location.search).get("assistantLabel") ?? "Assistant workspace",
          path: "/fixture",
          isAssistant: true,
        },
      ];
      store.settings.pushTitle = "Batty";
      store.settings.memoryLanguage = "English";
      store.models = [
        {
          id: "fixture/model",
          label: "Sol",
          provider: "fixture",
          reasoning: true,
          thinkingLevels: ["medium"],
          supportsImages: true,
        },
        {
          id: "fixture/memory",
          label: "Luna",
          provider: "fixture",
          reasoning: true,
          thinkingLevels: ["high"],
          supportsImages: true,
        },
      ];
      store.settings.defaultThinkingLevel = "medium";
      store.settings.memoryModel = "fixture/memory";
      store.settings.memoryThinkingLevel = "high";
      store.settings.defaultModel = "model";
      store.settings.defaultProvider = "fixture";
      store.getBattyAgentsFile = async () => "Global instructions";
      store.setBattyAgentsFile = async (content) => content;
      store.providerAuth = {
        providers: [
          { id: "openai", name: "OpenAI", connected: true, authKind: "oauth" },
          { id: "google", name: "Google", connected: false, authKind: "apiKey" },
          { id: "openrouter", name: "OpenRouter", connected: false, authKind: "apiKey" },
        ],
      };
      store.bootstrap = async () => {};
      store.refreshProviderAuthStatus = async () => {};
      const view = new URLSearchParams(location.search).get("view") ?? "settings";
      const popover =
        view === "cron" ? CronPopover : view === "tools" ? ToolsPopover : SettingsPopover;
      createApp({
        render: () =>
          new URLSearchParams(location.search).has("shell")
            ? h("div", { class: "app-shell", style: "display:flex;flex-direction:column" }, [
                h(ChatHeader),
                h("main", { style: "flex:1" }, "Conversation"),
                h(MessageComposer, { streaming: false, subagents: [] }),
              ])
            : h(popover, { popoverId: view, anchorName: "--settings" }),
      })
        .use(pinia)
        .mount("#app");
      document.getElementById(view)?.showPopover();
    </script>
  </body>
</html>

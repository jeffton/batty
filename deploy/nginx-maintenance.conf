# Include in the Batty HTTPS server block. Add the marker check documented in
# docs/maintenance.md to the existing location /.
location ^~ /maintenance/ {
    proxy_pass http://127.0.0.1:3149;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_read_timeout 3600s;
}
location ^~ /api/maintenance/ {
    proxy_pass http://127.0.0.1:3149;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_read_timeout 3600s;
}
error_page 418 = @batty_maintenance;
location @batty_maintenance {
    proxy_pass http://127.0.0.1:3149;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_read_timeout 3600s;
}
